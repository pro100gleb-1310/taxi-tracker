<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Учёт Такси и Доставка</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg: #f1f5f9;
      --card: #ffffff;
      --input-bg: #f8fafc;
      --text: #0f172a;
      --hint: #64748b;
      --btn: #006a63;
      --btn-text: #ffffff;
      --border: #cbd5e1;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0f172a;
        --card: #1e293b;
        --input-bg: #0f172a;
        --text: #f8fafc;
        --hint: #94a3b8;
        --btn: #0d9488;
        --btn-text: #ffffff;
        --border: #334155;
      }
    }

    *, *::before, *::after {
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100vh;
      overflow-x: hidden;
      background-color: var(--bg);
      color: var(--text);
    }

    body {
      padding: 14px 14px 32px;
    }

    /* Верхнее меню */
    .nav {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 4px;
      background: var(--card);
      padding: 4px;
      border-radius: 14px;
      margin-bottom: 14px;
      border: 1px solid var(--border);
    }
    .nav-btn {
      padding: 10px 8px;
      border: none;
      border-radius: 10px;
      background: transparent;
      color: var(--hint);
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
    }
    .nav-btn.active {
      background: var(--btn);
      color: var(--btn-text);
    }

    /* Вкладки направлений */
    .tabs {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px;
      margin-bottom: 12px;
    }
    .tab {
      padding: 12px 4px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: var(--card);
      color: var(--text);
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .tab.active {
      background: var(--btn);
      color: var(--btn-text);
      border-color: var(--btn);
    }

    /* Чипсы сервисов */
    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 14px;
    }
    .chip {
      padding: 9px 14px;
      border-radius: 20px;
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--text);
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
    }
    .chip.active {
      background: var(--btn);
      color: var(--btn-text);
      border-color: var(--btn);
      font-weight: 600;
    }

    /* Карточка формы */
    .card {
      background: var(--card);
      padding: 16px;
      border-radius: 16px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      border: 1px solid var(--border);
      width: 100%;
    }

    .row {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
      width: 100%;
    }
    .field {
      min-width: 0;
      width: 100%;
      display: flex;
      flex-direction: column;
    }

    label {
      font-size: 12px;
      color: var(--hint);
      margin-bottom: 6px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    input {
      display: block;
      width: 100%;
      min-width: 0;
      max-width: 100%;
      height: 46px;
      padding: 0 12px;
      border-radius: 11px;
      border: 1px solid var(--border);
      background: var(--input-bg);
      color: var(--text);
      font-size: 16px;
      line-height: 46px;
      outline: none;
      -webkit-appearance: none;
      appearance: none;
    }
    input[type="date"] {
      padding: 0 10px;
      font-size: 14px;
    }
    input:focus {
      border-color: var(--btn);
    }

    .presets {
      display: flex;
      gap: 6px;
      margin-top: 8px;
      flex-wrap: wrap;
    }
    .preset-btn {
      padding: 7px 11px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--input-bg);
      color: var(--text);
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
    }

    .submit-btn {
      margin-top: 16px;
      width: 100%;
      height: 50px;
      border: none;
      border-radius: 14px;
      background: var(--btn);
      color: var(--btn-text);
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
    }
    .submit-btn:disabled {
      opacity: 0.6;
    }

    /* Экран сводки */
    .kpi-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }
    .kpi-card {
      background: var(--card);
      padding: 14px;
      border-radius: 14px;
      border: 1px solid var(--border);
      min-width: 0;
    }
    .kpi-card.full {
      grid-column: 1 / -1;
      background: var(--btn);
      color: var(--btn-text);
      border-color: var(--btn);
    }
    .kpi-title {
      font-size: 12px;
      opacity: 0.85;
      margin-bottom: 5px;
    }
    .kpi-val {
      font-size: 21px;
      font-weight: 700;
      word-break: break-word;
    }
  </style>
</head>
<body>

  <div class="nav">
    <button class="nav-btn active" onclick="switchScreen('form', this)">➕ Новая запись</button>
    <button class="nav-btn" onclick="switchScreen('stats', this)">📊 За этот месяц</button>
  </div>

  <!-- ЭКРАН 1: ФОРМА ВВОДА -->
  <div id="screen-form">
    <div class="tabs">
      <button class="tab active" onclick="setDir('Такси', this)">🚕 Такси</button>
      <button class="tab" onclick="setDir('Доставка', this)">🎒 Доставка</button>
      <button class="tab" onclick="setDir('Расход', this)">⛽ Расход</button>
    </div>

    <div class="chips" id="services"></div>

    <div class="card">
      <div class="row">
        <div class="field">
          <label for="date">Дата</label>
          <input type="date" id="date">
        </div>
        <div class="field">
          <label for="mileage">Пробег (км)</label>
          <input type="number" id="mileage" placeholder="0" inputmode="decimal">
        </div>
      </div>

      <div class="row" id="incomeBlock">
        <div class="field">
          <label for="income">Доход (₴)</label>
          <input type="number" id="income" placeholder="0" inputmode="decimal">
        </div>
        <div class="field">
          <label for="tips">Чаевые / Бонусы</label>
          <input type="number" id="tips" placeholder="0" inputmode="decimal">
        </div>
      </div>

      <div class="field" id="expenseBlock" style="display:none;">
        <label for="expense">Сумма расхода (₴)</label>
        <input type="number" id="expense" placeholder="0" inputmode="decimal">
        <div class="presets">
          <button type="button" class="preset-btn" onclick="addFuelPreset(300)">+300 ₴</button>
          <button type="button" class="preset-btn" onclick="addFuelPreset(500)">+500 ₴</button>
          <button type="button" class="preset-btn" onclick="addFuelPreset(1000)">+1000 ₴</button>
          <button type="button" class="preset-btn" onclick="setCommentPreset('Полный бак')">Полный бак</button>
        </div>
      </div>

      <div class="field">
        <label for="comment">Комментарий</label>
        <input type="text" id="comment" placeholder="АЗС, кол-во заказов...">
      </div>
    </div>

    <button class="submit-btn" id="saveBtn" onclick="save()">Сохранить в таблицу</button>
  </div>

  <!-- ЭКРАН 2: СВОДКА ЗА МЕСЯЦ -->
  <div id="screen-stats" style="display:none;">
    <div class="kpi-grid">
      <div class="kpi-card full">
        <div class="kpi-title">Чистая прибыль за текущий месяц</div>
        <div class="kpi-val" id="st-profit">Загрузка...</div>
      </div>
      <div class="kpi-card">
        <div class="kpi-title">Общий доход</div>
        <div class="kpi-val" id="st-income">—</div>
      </div>
      <div class="kpi-card">
        <div class="kpi-title">Все расходы</div>
        <div class="kpi-val" id="st-expense">—</div>
      </div>
      <div class="kpi-card">
        <div class="kpi-title">На заправку</div>
        <div class="kpi-val" id="st-fuel">—</div>
      </div>
      <div class="kpi-card">
        <div class="kpi-title">Пробег за месяц</div>
        <div class="kpi-val" id="st-mileage">—</div>
      </div>
    </div>
  </div>

  <script>
    // 👇 ВСТАВЬТЕ СЮДА ВАШУ ССЫЛКУ ИЗ GOOGLE APPS SCRIPT 👇
    const API_URL = 'ВСТАВЬТЕ_СЮДА_ВАШ_URL_ИЗ_APPS_SCRIPT';

    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand();
    if (tg.setBackgroundColor) tg.setBackgroundColor('#0f172a');

    const CATALOG = {
      'Такси': ['Bolt Такси', 'Uklon', '838', 'OnTaxi'],
      'Доставка': ['Glovo', 'Bolt Food'],
      'Расход': ['Заправка', 'Другой расход']
    };

    let currentDir = 'Такси';
    let currentService = 'Bolt Такси';

    document.getElementById('date').valueAsDate = new Date();

    function addFuelPreset(amount) {
      const el = document.getElementById('expense');
      el.value = (Number(el.value) || 0) + amount;
      if (tg.HapticFeedback) tg.HapticFeedback.selectionChanged();
    }

    function setCommentPreset(text) {
      document.getElementById('comment').value = text;
      if (tg.HapticFeedback) tg.HapticFeedback.selectionChanged();
    }

    function switchScreen(screen, btn) {
      document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      document.getElementById('screen-form').style.display = screen === 'form' ? 'block' : 'none';
      document.getElementById('screen-stats').style.display = screen === 'stats' ? 'block' : 'none';
      if (screen === 'stats') loadStats();
    }

    function renderServices() {
      const container = document.getElementById('services');
      container.innerHTML = '';
      CATALOG[currentDir].forEach((srv, idx) => {
        const btn = document.createElement('button');
        btn.className = 'chip' + (idx === 0 ? ' active' : '');
        btn.textContent = srv;
        btn.onclick = () => {
          document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
          btn.classList.add('active');
          currentService = srv;
          if (tg.HapticFeedback) tg.HapticFeedback.selectionChanged();
        };
        container.appendChild(btn);
      });
      currentService = CATALOG[currentDir][0];
    }

    function setDir(dir, el) {
      currentDir = dir;
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      el.classList.add('active');
      const isExp = dir === 'Расход';
      document.getElementById('incomeBlock').style.display = isExp ? 'none' : 'grid';
      document.getElementById('expenseBlock').style.display = isExp ? 'flex' : 'none';
      renderServices();
      if (tg.HapticFeedback) tg.HapticFeedback.selectionChanged();
    }

    function updateStatsUI(stats) {
      document.getElementById('st-profit').textContent = stats.profit + ' ₴';
      document.getElementById('st-income').textContent = stats.income + ' ₴';
      document.getElementById('st-expense').textContent = stats.expense + ' ₴';
      document.getElementById('st-fuel').textContent = stats.fuel + ' ₴';
      document.getElementById('st-mileage').textContent = stats.mileage + ' км';
    }

    async function loadStats() {
      document.getElementById('st-profit').textContent = 'Загрузка...';
      try {
        const res = await fetch(API_URL + '?t=' + Date.now());
        const result = await res.json();
        if (result && result.stats) {
          updateStatsUI(result.stats);
        }
      } catch (e) {
        document.getElementById('st-profit').textContent = 'Ошибка: ' + e.message;
      }
    }

    async function save() {
      const btn = document.getElementById('saveBtn');
      btn.disabled = true;
      btn.textContent = 'Сохранение...';

      const params = new URLSearchParams({
        action: 'add',
        date: document.getElementById('date').value,
        direction: currentDir,
        service: currentService,
        income: currentDir !== 'Расход' ? (document.getElementById('income').value || 0) : 0,
        expense: currentDir === 'Расход' ? (document.getElementById('expense').value || 0) : 0,
        tips: currentDir !== 'Расход' ? (document.getElementById('tips').value || 0) : 0,
        mileage: document.getElementById('mileage').value || 0,
        comment: document.getElementById('comment').value || ''
      });

      try {
        const res = await fetch(API_URL + '?' + params.toString());
        const result = await res.json();
        if (result && result.stats) {
          updateStatsUI(result.stats);
        }

        if (tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
        tg.showAlert('✅ Запись добавлена в таблицу!', () => {
          document.getElementById('income').value = '';
          document.getElementById('expense').value = '';
          document.getElementById('tips').value = '';
          document.getElementById('mileage').value = '';
          document.getElementById('comment').value = '';
          btn.disabled = false;
          btn.textContent = 'Сохранить в таблицу';
        });
      } catch (err) {
        tg.showAlert('Ошибка: ' + err.message);
        btn.disabled = false;
        btn.textContent = 'Сохранить в таблицу';
      }
    }

    renderServices();
    loadStats();
  </script>
</body>
</html>
